:root{--bg:#f4f6f9;--card:#fff;--ink:#1f2937;--sub:#6b7280;--line:#e2e6ec;--accent:#2563eb;--pro:#e74c3c;--neu:#94a3b8;--ele:#2563eb}

html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif}
button{font-family:inherit;color:inherit}
#main{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 90px)}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav button{flex:1;border:none;background:none;padding:10px 0 12px;font-size:12px;font-weight:700;color:var(--sub)}
nav button span{display:block;font-size:20px;margin-bottom:2px}

.bhead{display:flex;align-items:center;gap:14px}
.bigsym{position:relative;width:72px;height:72px;border-radius:14px;background:var(--cc);color:#fff;font-size:34px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.bz{position:absolute;top:4px;left:7px;font-size:12px;font-weight:700}
.bname{font-size:24px;font-weight:800}
.bcat{font-size:13px;font-weight:700}
.bcat small{display:block;color:var(--sub);font-weight:500;font-size:11px}
.atomwrap{background:radial-gradient(circle at 50% 50%,#fff 0,#eef2f8 100%);border:1px solid var(--line);border-radius:16px;margin:12px 0 10px;padding:6px}
.atom{width:100%;max-width:360px;display:block;margin:0 auto}
.orb{fill:none;stroke:#c7d0dd;stroke-width:1.2}
.orb.outer{stroke:#93a7c4;stroke-dasharray:3 3}
.shl{font-size:8.5px;fill:#64748b;font-weight:800;text-anchor:middle;paint-order:stroke;stroke:#f4f7fb;stroke-width:3px}
.pro{fill:var(--pro);stroke:#fff;stroke-width:.8}
.neu{fill:var(--neu);stroke:#fff;stroke-width:.8}
.nuc{fill:#fbe3e0;stroke:#e74c3c}
.nt{font-size:10px;text-anchor:middle;fill:#7f1d1d;font-weight:700}
.ele{fill:#93b4f5}
.ele.val{fill:var(--ele)}
.ele.pop{animation:pop .7s ease-out;transform-box:fill-box;transform-origin:center}
@keyframes pop{0%{transform:scale(3);opacity:0}60%{transform:scale(1.4);opacity:1}100%{transform:scale(1)}}
.atom{animation:fadein .35s}
@keyframes fadein{from{opacity:.4}to{opacity:1}}
.legend{display:flex;justify-content:center;gap:14px;font-size:12px;color:var(--sub);padding:2px 0 6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.legend i.pro{background:var(--pro)}.legend i.neu{background:var(--neu)}.legend i.ele{background:var(--ele)}
.ctrl{display:flex;align-items:center;gap:10px}

.big.plus{background:var(--accent)}.big.minus{background:#94a3b8}

.cmid{flex:1}
#zs{width:100%;accent-color:var(--accent)}
.ztxt{text-align:center;font-size:12px;color:var(--sub)}
.playrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px;font-size:14px;font-weight:700}
.btn.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.red{background:#fff1f0;border-color:#f5b5ae;color:#b91c1c}
.btn.wide{display:block;width:100%;margin:10px 0}
.msg{background:#eef4ff;border-left:4px solid var(--accent);border-radius:8px;padding:10px 12px;font-size:14px;line-height:1.75;margin-bottom:10px}
.info{background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px 12px}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.row:last-child{border-bottom:none}
.row span{color:var(--sub);flex:none}
.row b{text-align:right;font-weight:700}
.row small{color:var(--sub);font-weight:500}
.cfg{font-size:12px;font-weight:600;line-height:1.7}
.cfg sup{font-size:9px}
.ion{margin-top:10px;background:#fff8e6;border:1px solid #f3d38a;border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.7}
.note{margin-top:10px;background:#fff;border:1px dashed #cbd5e1;border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.7}
.where{font-size:12px;color:var(--sub);font-weight:700;margin:14px 0 6px}
.ptable{display:grid;grid-template-columns:repeat(18,1fr);gap:2px}
.ptable.mini{gap:1.5px}
.pc{border:none;padding:0;border-radius:3px;background:color-mix(in srgb,var(--cc) 30%,#fff);aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;overflow:hidden}
.ptable.mini .pc{font-size:7px;font-weight:800;color:transparent;border-radius:2px}
.ptable.mini .pc.cur{color:#fff}
.pc.cur{background:var(--cc);color:#fff!important;outline:2px solid var(--ink);z-index:1;transform:scale(1.25)}
.pgap{display:flex;align-items:center;justify-content:center;font-size:8px;color:var(--sub)}
.tscroll{overflow-x:auto;margin:0 -16px;padding:0 16px 6px}
.tscroll .ptable{min-width:720px}
.tscroll .pc{aspect-ratio:auto;height:44px;border-radius:4px}

.tscroll .pc.cur .pz,.tscroll .pc.cur .pn{color:#fff}
.ttl{font-size:20px;font-weight:800;margin:4px 0 10px}
.ttl small{font-size:12px;color:var(--sub);font-weight:500;margin-left:6px}
.legend2{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;margin-top:10px}
.legend2 i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-2px}
.foot{font-size:11.5px;color:var(--sub);line-height:1.7;margin-top:12px}
.bar{font-size:13px;color:var(--sub);margin-bottom:10px}.bar b{color:var(--ink);font-size:16px}
.sub{font-size:13px;font-weight:700;margin:6px 0}
.mode{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:8px}
.mt{font-weight:800;font-size:16px}.md{font-size:12px;color:var(--sub);margin-top:2px}
.qhead{display:flex;align-items:center;gap:10px;font-weight:800;margin-bottom:8px}
.qhead .n{margin-left:auto;font-size:13px;color:var(--sub);font-weight:600}
.back{border:none;background:none;font-size:22px;padding:6px 10px 6px 0}
.qtype{display:inline-block;font-size:11px;font-weight:800;color:#fff;background:var(--accent);border-radius:5px;padding:2px 8px;margin-bottom:8px}
.qcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px 14px;text-align:center;font-size:16px;line-height:1.8;margin-bottom:12px}
.qbig{font-size:30px;font-weight:800}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ch{border:1.5px solid #cbd5e1;background:#fff;border-radius:12px;min-height:58px;font-size:16px;font-weight:700;padding:8px}
.ch.right{background:#16a34a;border-color:#16a34a;color:#fff}
.ch.bad{background:#fee2e2;border-color:#fca5a5;color:#991b1b;text-decoration:line-through}
.fb{margin-top:12px;background:#ecfdf5;border-radius:10px;padding:10px 12px;font-size:14px;font-weight:700;line-height:1.7}
.fb.ng{background:#fef2f2;color:#991b1b}
.fbel{font-weight:500;color:var(--ink);font-size:13px;margin-top:4px}

.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.center{text-align:center}.big{}

.back2{margin-top:0}
#fx{position:fixed;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;z-index:20}
#fx .ok{font-size:150px;color:#16a34a;opacity:0;animation:ok .7s ease-out}

#dlg{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:30;padding:24px}
#dlg.on{display:flex}

/* 電子配置の例外（マーデルングの規則からのずれ）：[軌道, 増減] */
const EXC={24:[['4s',-1],['3d',1]],29:[['4s',-1],['3d',1]],41:[['5s',-1],['4d',1]],42:[['5s',-1],['4d',1]],44:[['5s',-1],['4d',1]],45:[['5s',-1],['4d',1]],46:[['5s',-2],['4d',2]],47:[['5s',-1],['4d',1]],
 57:[['4f',-1],['5d',1]],58:[['4f',-1],['5d',1]],64:[['4f',-1],['5d',1]],78:[['6s',-1],['5d',1]],79:[['6s',-1],['5d',1]],
 89:[['5f',-1],['6d',1]],90:[['5f',-2],['6d',2]],91:[['5f',-1],['6d',1]],92:[['5f',-1],['6d',1]],93:[['5f',-1],['6d',1]],96:[['5f',-1],['6d',1]],103:[['6d',-1],['7p',1]]};
const ORDER=['1s','2s','2p','3s','3p','4s','3d','4p','5s','4d','5p','6s','4f','5d','6p','7s','5f','6d','7p'];
const CAP={s:2,p:6,d:10,f:14};
const SHELL='KLMNOPQ';

function config(Z){
 const c={};let left=Z;
 for(const o of ORDER){if(!left)break;const n=Math.min(CAP[o[1]],left);c[o]=n;left-=n;}
 (EXC[Z]||[]).forEach(([o,d])=>{c[o]=(c[o]||0)+d;if(!c[o])delete c[o];});
 return c;
}
function shellsOf(Z){const c=config(Z),s=[0,0,0,0,0,0,0];Object.keys(c).forEach(o=>s[+o[0]-1]+=c[o]);while(s.length&&!s[s.length-1])s.pop();return s;}
function configText(Z){const c=config(Z);return ORDER.filter(o=>c[o]).sort((a,b)=>a[0]-b[0]||'spdf'.indexOf(a[1])-'spdf'.indexOf(b[1])).map(o=>o+'<sup>'+c[o]+'</sup>').join(' ');}

const PERIOD_END=[2,10,18,36,54,86,118];
function periodOf(Z){return PERIOD_END.findIndex(e=>Z<=e)+1;}
function groupOf(Z){
 const p=periodOf(Z),start=p===1?1:PERIOD_END[p-2]+1,off=Z-start;
 if(p===1)return Z===1?1:18;
 if(p<=3)return off<2?off+1:off+11;
 if(p<=5)return off+1;
 if(off<2)return off+1;
 if(off<=16)return 3;          // ランタノイド・アクチノイド（3族）
 return off-13;
}
function isLan(Z){return Z>=57&&Z<=71;}
function isAct(Z){return Z>=89&&Z<=103;}
function catOf(Z){
 const g=groupOf(Z);
 if(Z===1)return 'h';
 if(isLan(Z))return 'lan';
 if(isAct(Z))return 'act';
 if(g===1)return 'alk';
 if(g===2)return 'ae';
 if(g>=3&&g<=12)return 'tr';
 if(g===17)return 'hal';
 if(g===18)return 'nob';
 return NONMETAL.includes(Z)?'nm':'met';
}
const CATS={h:['水素','#5d8aa8'],alk:['アルカリ金属','#e74c3c'],ae:['アルカリ土類金属','#e67e22'],tr:['遷移元素','#c9a227'],lan:['ランタノイド','#b5651d'],act:['アクチノイド','#a0522d'],met:['その他の金属（典型元素）','#7f8c8d'],nm:['非金属','#27ae60'],hal:['ハロゲン','#16a085'],nob:['貴ガス','#8e44ad']};

const EL=RAW_EL.replace(/\s/g,'').split('|').map((s,i)=>{
 const [sym,name,w,a]=s.split(',');const Z=i+1;
 return {Z,sym,name,w,A:+a,N:+a-Z,period:periodOf(Z),group:groupOf(Z),cat:catOf(Z),
  state:Z>=100?'不明':GAS.includes(Z)?'気体':LIQUID.includes(Z)?'液体':'固体',
  metal:!NONMETAL.includes(Z)};
});

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function valence(e){if(e.cat==='nob')return 0;if(e.group===1||e.group===2)return e.group;if(e.group>=13)return e.group-10;return null;}
function shellTxt(Z){return shellsOf(Z).map((n,i)=>SHELL[i]+n).join(' ');}

/* ====== 何が変わった？ ====== */
function changeMsg(Z){
 const e=EL[Z-1],s=shellsOf(Z),p=Z>1?shellsOf(Z-1):[],v=valence(e),out=[];
 if(Z===1)return 'いちばん単純な原子。原子核に陽子が1個、そのまわりのK殻に電子が1個。';
 if(Z===2)return 'K殻に2個目の電子が入り、K殻がいっぱいになった。とても安定していて、ほとんど反応しない（貴ガス）。';
 out.push(`陽子が1個増えて${Z}個になり、別の元素「${e.name}」になった。電子も1個増えて${Z}個。`);
 if(s.length>p.length)out.push(`内側の殻がいっぱいになったので、新しい<b>${SHELL[s.length-1]}殻</b>に電子が入り始めた。ここから<b>第${e.period}周期</b>。`);
 if(EXC[Z])out.push('<b>例外</b>：順番どおりなら最外殻に入る電子が、内側の殻に移っている（その方が安定するため）。');
 if(NOBLE.includes(Z))out.push(`最外殻の電子が8個になり、とても安定した。ほとんど反応しない<b>貴ガス</b>で、第${e.period}周期はここで終わり。`);
 else if(e.cat==='alk')out.push('最外殻の電子は1個だけ。これを失いやすく、+1のイオンになりやすい<b>アルカリ金属</b>。');
 else if(e.cat==='ae')out.push('最外殻の電子は2個。2個を失って+2のイオンになりやすい。');
 else if(e.cat==='hal')out.push(`最外殻の電子は7個。あと1個で貴ガスと同じ形になるので、電子を1個受け取って−1のイオンになりやすい<b>ハロゲン</b>。`);
 else if(e.cat==='lan')out.push('<b>ランタノイド</b>：新しい電子は、外から3番目の殻（4f）に入っていく。外側の電子の数がほとんど変わらないので、性質がとても似ている。');
 else if(e.cat==='act')out.push('<b>アクチノイド</b>：新しい電子は、外から3番目の殻（5f）などに入っていく。すべて放射性の元素。');
 else if(e.cat==='tr')out.push('<b>遷移元素</b>：新しい電子は最外殻ではなく、内側の殻（d軌道）に入っていく。最外殻の電子は1〜2個のままなので、となりどうしの元素の性質が似ている。');
 else if(v!==null)out.push(`最外殻の電子（価電子）は${v}個（${e.group}族）。`);
 if(Z>=104)out.push('<small>※この元素の電子配置は、ごく少量しかつくれないため理論による予想です。</small>');
 return out.join('<br>');
}

/* ====== 原子の図（ボーアモデル） ====== */
function atomSVG(Z,popLast){
 const e=EL[Z-1],s=shellsOf(Z),c=150,rs=s.map((_,i)=>44+i*16);
 let g=`<svg viewBox="0 0 300 300" class="atom" role="img" aria-label="${e.name}の原子模型">`;
 rs.forEach((r,i)=>{g+=`<circle cx="${c}" cy="${c}" r="${r}" class="orb ${i===s.length-1?'outer':''}"/><text x="${c+r-1}" y="${c+3.5}" class="shl">${SHELL[i]}</text>`;});
 // 原子核
 const P=Z,N=e.N,tot=P+N;
 if(tot<=60){
  const pts=[];const R=Math.min(28,6+Math.sqrt(tot)*3.2);
  for(let k=0;k<tot;k++){const a=k*2.39996,rr=R*Math.sqrt((k+0.5)/tot);pts.push([c+rr*Math.cos(a),c+rr*Math.sin(a)]);}
  const kinds=[];let pp=P,nn=N;for(let k=0;k<tot;k++){if(pp&&(nn===0||k%2===0)){kinds.push('p');pp--;}else if(nn){kinds.push('n');nn--;}else{kinds.push('p');pp--;}}
  const nr=tot<=12?5.5:tot<=30?4.6:3.9;
  pts.forEach((q,k)=>{g+=`<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="${nr}" class="${kinds[k]==='p'?'pro':'neu'}"/>`;});
 }else{
  g+=`<circle cx="${c}" cy="${c}" r="30" class="nuc"/><text x="${c}" y="${c-3}" class="nt">陽子${P}</text><text x="${c}" y="${c+12}" class="nt">中性子${N}</text>`;
 }
 // 電子
 let idx=0;
 s.forEach((n,i)=>{const r=rs[i];for(let k=0;k<n;k++){const a=-Math.PI/2+k*2*Math.PI/n;idx++;
  const last=popLast&&i===s.length-1&&k===n-1;
  g+=`<circle cx="${(c+r*Math.cos(a)).toFixed(1)}" cy="${(c+r*Math.sin(a)).toFixed(1)}" r="${n>18?3.2:4.2}" class="ele ${i===s.length-1?'val':''} ${last?'pop':''}"/>`;}});
 return g+'</svg>';
}

function cellPos(e){

}

 return h+'</div>';
}

function renderBuild(pop){
 const Z=S.Z,e=EL[Z-1],v=valence(e),s=shellsOf(Z);
 S.seen[Z]=1;save();
 let h=`<div class="bhead"><div class="bigsym" style="--cc:${CATS[e.cat][1]}"><span class="bz">${Z}</span>${e.sym}</div><div><div class="bname">${e.name}</div><div class="bcat" style="color:${CATS[e.cat][1]}">${catName(e.cat)}${e.group===12?'<small>（12族は典型元素に分類する教科書もある）</small>':''}</div></div></div>`;

 h+=`<div class="msg">${changeMsg(Z)}</div>`;
 h+=`<div class="info">
  <div class="row"><span>電子殻</span><b>${s.map((n,i)=>`${SHELL[i]}殻 ${n}`).join('　')}</b></div>
  <div class="row"><span>電子配置</span><b class="cfg">${configText(Z)}</b></div>
  <div class="row"><span>周期・族</span><b>第${e.period}周期・${e.group}族${isLan(Z)?'（ランタノイド）':isAct(Z)?'（アクチノイド）':''}</b></div>
  <div class="row"><span>最外殻の電子</span><b>${s[s.length-1]}個${v!==null?`　（価電子 ${v}個）`:''}</b></div>
  <div class="row"><span>原子量</span><b>${e.w}</b></div>
  <div class="row"><span>中性子</span><b>${e.N}個 <small>（質量数${e.A}の原子の場合）</small></b></div>
  <div class="row"><span>常温での状態</span><b>${e.state}${e.metal?'・金属':'・非金属'}</b></div>
  ${IONS[Z]?`<div class="row"><span>なりやすいイオン</span><b>${IONS[Z]}</b></div>`:''}
 </div>`;
 if(ION_Q[Z]){const q=ION_Q[Z],nb=q>0?NOBLE.filter(n=>n<Z).pop():NOBLE.find(n=>n>Z);
  h+=`<div class="ion">イオンになると：電子を${Math.abs(q)}個${q>0?'失って':'受け取って'} <b>${IONS[Z]}</b> に。${nb?`電子の数が${Z-q}個になり、貴ガスの<b>${EL[nb-1].name}</b>と同じ電子配置（${shellTxt(nb)}）になる。`:'原子核（陽子1個）だけになる。'}</div>`;}
 if(NOTES[Z]) h+=`<div class="note"><b>豆知識</b>　${NOTES[Z]}</div>`;
 else if(Z>=93) h+=`<div class="note"><b>豆知識</b>　天然にはほとんど存在せず、原子炉や加速器で人工的につくられた放射性元素。</div>`;
 else if(Z>=84) h+=`<div class="note"><b>豆知識</b>　安定な同位体がない放射性元素。</div>`;
 h+=`<div class="where">周期表のどこ？</div>${tableHTML(Z,true)}`;
 h+=`<div class="foot">同じ元素でも中性子の数がちがう原子（同位体）があります。ここでは代表的な原子の中性子の数を示しています。</div>`;
 $('#main').innerHTML=h;
 $('#zs').addEventListener('input',ev=>{S.Z=+ev.target.value;renderBuild();});
}

}

/* ====== クイズ ====== */
const RANGES=[{id:20,name:'1〜20番（中学・高校の基本）'},{id:36,name:'1〜36番（第4周期まで）'},{id:118,name:'1〜118番（すべて）'}];
const QT={
 sym2name:{name:'記号 → 名前',ok:e=>true},
 name2sym:{name:'名前 → 記号',ok:e=>true},
 z2name:{name:'原子番号 → 元素',ok:e=>true},
 shell2name:{name:'電子殻 → 元素',ok:e=>e.Z<=20},
 valence:{name:'価電子の数',ok:e=>e.Z<=20},
 cat:{name:'元素の分類',ok:e=>!['lan','act'].includes(e.cat)||true},
 ion:{name:'イオン',ok:e=>ION_Q[e.Z]!==undefined},
 pos:{name:'周期・族 → 元素',ok:e=>!isLan(e.Z)&&!isAct(e.Z)}};
function near(e,maxZ,n){const pool=EL.filter(x=>x.Z!==e.Z&&x.Z<=maxZ);const close=shuffle(pool.filter(x=>Math.abs(x.Z-e.Z)<=4||x.group===e.group));const far=shuffle(pool);return [...new Set(close.concat(far))].slice(0,n);}
function supChg(q){const a=Math.abs(q),sign=q>0?'⁺':'⁻';return ['','','²','³'][a]+sign;}
function makeQ(type,Z,maxZ){
 const e=EL[Z-1],d=near(e,Math.max(maxZ,Z),3);
 switch(type){
 case 'sym2name':return{q:`<span class="qbig">${e.sym}</span><br>この元素の名前は？`,a:e.name,ch:[e.name,...d.map(x=>x.name)]};
 case 'name2sym':return{q:`<span class="qbig">${e.name}</span><br>元素記号は？`,a:e.sym,ch:[e.sym,...d.map(x=>x.sym)]};
 case 'z2name':return{q:`原子番号 <span class="qbig">${Z}</span> の元素は？`,a:`${e.name}（${e.sym}）`,ch:[e,...d].map(x=>`${x.name}（${x.sym}）`)};
 case 'shell2name':return{q:`電子殻の電子の数が<br><span class="qbig">${shellTxt(Z)}</span><br>の元素は？`,a:e.name,ch:[e.name,...d.map(x=>x.name)]};
 case 'valence':{const v=valence(e);const o=shuffle([0,1,2,3,4,5,6,7].filter(x=>x!==v)).slice(0,3);return{q:`<span class="qbig">${e.name}（${e.sym}）</span><br>価電子の数は？`,a:v+'個',ch:[v,...o].map(x=>x+'個'),hint:e.cat==='nob'?'貴ガスは安定していて反応しにくいので、価電子の数は0とする。':''};}
 case 'cat':{const all=['アルカリ金属','アルカリ土類金属','遷移元素','ハロゲン','貴ガス','非金属','その他の金属（典型元素）','ランタノイド','アクチノイド','水素'];const a=catName(e.cat);const o=shuffle(all.filter(x=>x!==a&&x!=='水素')).slice(0,3);return{q:`<span class="qbig">${e.name}（${e.sym}）</span><br>どのなかま？`,a,ch:[a,...o]};}
 case 'ion':{const q=ION_Q[Z];const o=[-3,-2,-1,1,2,3].filter(x=>x!==q).sort((a,b)=>Math.abs(a-q)-Math.abs(b-q)).slice(0,3);if(!o.includes(-q))o[2]=-q;const a=e.sym+supChg(q);return{q:`<span class="qbig">${e.name}（${e.sym}）</span><br>なりやすいイオンは？`,a,ch:[q,...o].map(x=>e.sym+supChg(x))};}
 case 'pos':return{q:`<span class="qbig">第${e.period}周期・${e.group}族</span><br>の元素は？`,a:`${e.name}（${e.sym}）`,ch:[e,...EL.filter(x=>x.Z!==e.Z&&!isLan(x.Z)&&!isAct(x.Z)&&(x.period===e.period||x.group===e.group)&&x.Z<=Math.max(maxZ,Z)).sort(()=>Math.random()-.5).slice(0,3)].map(x=>`${x.name}（${x.sym}）`)};
 }
}
let QZ=null;
function renderQuizHome(){
 const wc=Object.keys(S.weak).length;
 let h=`<div class="ttl">クイズ</div><div class="bar">連続正解 <b>${S.streak}</b>（最高 ${S.best}）　苦手 <b>${wc}</b>問</div>`;

 if(wc)h+=`<button class="btn red wide" data-act="qreview">苦手を復習する（${wc}問）</button>`;

function startQuiz(maxZ){
 const items=[];const types=Object.keys(QT);let guard=0;
 while(items.length<10&&guard++<500){const t=types[Math.floor(Math.random()*types.length)];const Z=1+Math.floor(Math.random()*maxZ);if(!QT[t].ok(EL[Z-1]))continue;
  const id=t+':'+Z;if(items.some(x=>x.id===id))continue;items.push({id,t,Z});}
 // 苦手を優先して混ぜる
 const weak=shuffle(Object.keys(S.weak).filter(id=>+id.split(':')[1]<=maxZ)).slice(0,3);
 weak.forEach((id,i)=>{if(!items.some(x=>x.id===id)){const [t,z]=id.split(':');items[i]={id,t,Z:+z};}});
 QZ={maxZ,items:shuffle(items),idx:0,wrong:[],round:1,inter:false};prepQ();renderQ();
}
function startReview(){const items=shuffle(Object.keys(S.weak)).slice(0,10).map(id=>{const [t,z]=id.split(':');return{id,t,Z:+z};});QZ={maxZ:118,review:1,items,idx:0,wrong:[],round:1,inter:false};prepQ();renderQ();}
function prepQ(){const it=QZ.items[QZ.idx];const q=makeQ(it.t,it.Z,QZ.maxZ);q.ch=shuffle([...new Set(q.ch)]);QZ.cur=Object.assign(q,{it,done:false,picked:null});}
function renderQ(){
 let h=`<div class="qhead"><button class="back" data-act="qquit">←</button><span>${QZ.review?'苦手の復習':'クイズ'}</span><span class="n">${QZ.round>1?'やり直し ':''}${QZ.idx+1} / ${QZ.items.length}</span></div>`;
 if(QZ.inter){h+=`<div class="center"><div class="big">間違えた ${QZ.items.length} 問を<br>もう一度</div><button class="btn dark wide" data-act="qresume">始める</button></div>`;$('#main').innerHTML=h;return;}
 const c=QZ.cur,e=EL[c.it.Z-1];
 h+=`<div class="qtype">${QT[c.it.t].name}</div><div class="qcard">${c.q}</div><div class="choices">`;
 c.ch.forEach((x,i)=>{let cl='ch';if(c.done){if(x===c.a)cl+=' right';else if(x===c.picked)cl+=' bad';}h+=`<button class="${cl}" data-act="qch" data-i="${i}" ${c.done?'disabled':''}>${x}</button>`;});
 h+='</div>';
 if(c.done){
  h+=`<div class="fb ${c.picked===c.a?'':'ng'}">${c.picked===c.a?'○ 正解！':'✕ 正解は '+c.a}<div class="fbel"><span class="elbadge" style="background:${CATS[e.cat][1]}">${e.Z} ${e.sym}</span> ${e.name}・${catName(e.cat)}・第${e.period}周期 ${e.group}族・${shellTxt(e.Z)}</div>${c.hint?`<small>${c.hint}</small>`:''}</div>`;
  h+=`<div class="row2"><button class="btn" data-act="qsee">模型で見る</button><button class="btn dark" data-act="qnext">次へ</button></div>`;
 }
 $('#main').innerHTML=h;
}
function chooseQ(i){
 const c=QZ.cur;if(c.done)return;c.picked=c.ch[i];c.done=true;const id=c.it.id;
 if(c.picked===c.a){S.streak++;if(S.streak>S.best)S.best=S.streak;if(QZ.round===1&&S.weak[id]!=null){S.weak[id]++;if(S.weak[id]>=3)delete S.weak[id];}flash();}
 else{S.streak=0;S.weak[id]=0;QZ.wrong.push(c.it);}
 save();renderQ();
}
function nextQ(){QZ.idx++;if(QZ.idx>=QZ.items.length){if(QZ.wrong.length){QZ.items=shuffle(QZ.wrong);QZ.wrong=[];QZ.idx=0;QZ.round++;QZ.inter=true;renderQ();return;}
  $('#main').innerHTML=`<div class="center"><div class="big">全問正解！</div><p>連続正解 ${S.streak}</p><button class="btn dark wide" data-act="qhome">クイズのトップへ</button></div>`;QZ=null;return;}
 prepQ();renderQ();}
function flash(){const f=$('#fx');f.innerHTML='<div class="ok">○</div>';setTimeout(()=>f.innerHTML='',700);}

/* ====== 確認ダイアログ ====== */
function ask(msg,ok,fn){const d=$('#dlg');d.querySelector('.msg').innerHTML=msg;const r=d.querySelector('.row');r.innerHTML='';
 const c=document.createElement('button');c.className='btn';c.textContent='続ける';c.onclick=()=>d.classList.remove('on');
 const o=document.createElement('button');o.className='btn dark';o.textContent=ok;o.onclick=()=>{d.classList.remove('on');fn();};r.append(c,o);d.classList.add('on');}

/* ====== 操作 ====== */
$('#main').addEventListener('click',ev=>{
 const pc=ev.target.closest('.pc');if(pc){stopPlay();S.Z=+pc.dataset.z;setTab('build');return;}
 const b=ev.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act;
 if(a==='inc'){stopPlay();setZ(S.Z+1,true);}
 else if(a==='dec'){stopPlay();setZ(S.Z-1);}
 else if(a==='play')togglePlay();
 else if(a==='tbl')setTab('table');
 else if(a==='qstart')startQuiz(+b.dataset.r);
 else if(a==='qreview')startReview();
 else if(a==='qch')chooseQ(+b.dataset.i);
 else if(a==='qnext')nextQ();
 else if(a==='qresume'){QZ.inter=false;prepQ();renderQ();}
 else if(a==='qhome')renderQuizHome();
 else if(a==='qquit')ask('クイズをやめますか？','やめる',()=>{QZ=null;renderQuizHome();});
 else if(a==='qsee'){S.Z=QZ.cur.it.Z;const keep=QZ;setTab('build');$('#main').insertAdjacentHTML('afterbegin','<button class="btn wide back2" data-act="qback">← クイズに戻る</button>');window._keepQ=keep;}
 else if(a==='qback'){QZ=window._keepQ;tab='quiz';document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x.dataset.tab==='quiz'));renderQ();}
});
setTab('build');

</script></body></html>
